name: Trigger UI tests

on:
  push:
    branches: [main]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel to build and deploy
        run: sleep 180

      - name: Dispatch to selenium repo
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.E2E_REPO_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ddnoergaard/sso_frontend_Selenium_test/dispatches \
            -d '{"event_type":"frontend-merged","client_payload":{"sha":"${{ github.sha }}"}}'
